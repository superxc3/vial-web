name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: |
        git clone -b xcmkb https://github.com/superxc3/vial-gui.git
        git clone https://github.com/vial-kb/via-keymap-precompiled.git
        ./fetch-emsdk.sh
        ./fetch-deps.sh
        ./build-deps.sh
        cd src
        ./build.sh

    # Sizes of the toolchain/deps trees, to decide what is worth caching between runs
    - name: Report build tree sizes
      if: always()
      run: du -sh emsdk sources deps deps/* src/build 2>/dev/null || true

    - uses: actions/upload-artifact@v4
      with:
        name: vial-web
        path: src/build

    - uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      with:
        path: src/build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/configure-pages@v5
      with:
        enablement: true
    - id: deployment
      uses: actions/deploy-pages@v4
