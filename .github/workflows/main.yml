name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # build.sh stamps the page with the last commit touching vialgui/

    # The WASM toolchain (emsdk) and the Qt/CPython/PyQt5 static libs only depend on the pinned
    # versions and patches, so cache them; a hit turns a ~40 min run into a few minutes.
    - name: Restore toolchain and dependency cache
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          emsdk
          deps
        key: deps-v1-${{ runner.os }}-${{ hashFiles('version.sh', 'fetch-emsdk.sh', 'fetch-deps.sh', 'build-deps.sh', 'prune-deps.sh', 'patches/**') }}

    - name: Build toolchain and dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        ./fetch-emsdk.sh
        ./fetch-deps.sh
        ./build-deps.sh

    - name: Build vial-web
      run: |
        git clone https://github.com/vial-kb/via-keymap-precompiled.git
        cd src
        ./build.sh

    # Shrink deps/ to what build.sh actually links against before the post-job cache save.
    # Never fails the run: worst case the cache entry is just larger.
    - name: Prune dependencies for caching
      if: steps.cache.outputs.cache-hit != 'true'
      continue-on-error: true
      run: |
        du -sh emsdk sources deps deps/* 2>/dev/null || true
        ./prune-deps.sh

    - uses: actions/upload-artifact@v4
      with:
        name: vial-web
        path: src/build

    - uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/xcmkb' && github.event_name != 'pull_request'
      with:
        path: src/build

  deploy:
    if: github.ref == 'refs/heads/xcmkb' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/configure-pages@v5
      with:
        enablement: true
    - id: deployment
      uses: actions/deploy-pages@v4
